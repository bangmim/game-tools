[build]
  command = "pnpm build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "10"
  NEXT_TELEMETRY_DISABLED = "1"

# Static export (output: 'export') — no @netlify/plugin-nextjs needed.
# Netlify serves the `out/` directory as a plain static site.

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
